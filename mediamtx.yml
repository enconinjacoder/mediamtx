###############################################
# Global settings -> General
###############################################
logLevel: info
logDestinations: [stdout]
logStructured: false
logFile: mediamtx.log
sysLogPrefix: mediamtx
dumpPackets: false

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1452
udpReadBufferSize: 0

runOnConnect:
runOnConnectRestart: false
runOnDisconnect:

###############################################
# Global settings -> Authentication
###############################################
# Every publish, read and API call is checked by the backend
# (POST /api/v1/streams/mediamtx/auth, handlers.MediaMTXAuthHandler):
#   publish: OBS stream key "<playback_id>?key=<stream_key>", stream scheduled or live
#   read:    never via the backend (it refuses); the CDN's reads carry hlsCDNSecret and skip auth
#   api:     only the backend's kick call, Bearer <MEDIAMTX_HOOK_SECRET>
# MediaMTX doesn't expand $VARS in config values (only in hook commands), so
# the real address is built from BACKEND_URL when MediaMTX starts.
# BACKEND_URL="http://aarpaar-backend.railway.internal:4048"
# MEDIAMTX_HOOK_SECRET="${{shared.MEDIAMTX_HOOK_SECRET}}"
# MTX_AUTHHTTPADDRESS="${{BACKEND_URL}}/api/v1/streams/mediamtx/auth?secret=${{MEDIAMTX_HOOK_SECRET}}"
# MTX_AUTHHTTPADDRESS overrides the local default below.
authMethod: http

authInternalUsers: []

authHTTPAddress: http://localhost:8080/api/v1/streams/mediamtx/auth
authHTTPFingerprint:
authHTTPExclude: []

authJWTJWKS:
authJWTJWKSFingerprint:
authJWTClaimKey: mediamtx_permissions
authJWTExclude: []
authJWTIssuer:
authJWTAudience:

###############################################
# Global settings -> Control API
###############################################
# Only used by the backend to disconnect OBS when a stream ends. Keep it on
# Railway's private network: do not create a public domain for this port.
api: true
apiAddress: :9997
apiEncryption: false
apiServerKey: server.key
apiServerCert: server.crt
apiAllowOrigins: ["*"]
apiTrustedProxies: []

###############################################
# Global settings -> Metrics server
###############################################
metrics: false
metricsAddress: :9998
metricsEncryption: false
metricsServerKey: server.key
metricsServerCert: server.crt
metricsAllowOrigins: ["*"]
metricsTrustedProxies: []

###############################################
# Global settings -> PPROF server
###############################################
pprof: false
pprofAddress: :9999
pprofEncryption: false
pprofServerKey: server.key
pprofServerCert: server.crt
pprofAllowOrigins: ["*"]
pprofTrustedProxies: []

###############################################
# Global settings -> Playback server
###############################################
playback: false
playbackAddress: :9996
playbackEncryption: false
playbackServerKey: server.key
playbackServerCert: server.crt
playbackAllowOrigins: ["*"]
playbackTrustedProxies: []

###############################################
# Global settings -> RTSP server
###############################################
# Disabled as requested
rtsp: false
rtspTransports: [udp, multicast, tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001
multicastIPRange: 224.1.0.0/16
multicastRTPPort: 8002
multicastRTCPPort: 8003
srtpAddress: :8004
srtcpAddress: :8005
multicastSRTPPort: 8006
multicastSRTCPPort: 8007
rtspServerKey: server.key
rtspServerCert: server.crt
rtspAuthMethods: [basic]
rtspTrustedProxies: []

###############################################
# Global settings -> RTMP server
###############################################
# Enabled as requested
rtmp: true
rtmpEncryption: "no"
rtmpAddress: 0.0.0.0:1935
rtmpsAddress: :1936
rtmpServerKey: server.key
rtmpServerCert: server.crt
rtmpTrustedProxies: []

###############################################
# Global settings -> HLS server
###############################################
# Configured based on your requested parameters
hls: true
hlsAddress: "0.0.0.0:5081"
hlsEncryption: false
hlsServerKey: server.key
hlsServerCert: server.crt
hlsAllowOrigins: ["*"]

hlsTrustedProxies: []

hlsAlwaysRemux: false
hlsVariant: fmp4           # CHANGED: fmp4 is lighter and universally supported by CDNs
hlsSegmentCount: 7       
hlsSegmentDuration: 4s     # CHANGED: 4-second chunks are the industry standard for CDN caching
hlsDirectory: ""
hlsSegmentMaxSize: 50M     
hlsMuxerCloseAfter: 120s   # CHANGED: Keeps the stream warm for 2 full minutes
# Requests with "Authorization: Bearer <hlsCDNSecret>" are the CDN: one shared
# session per stream, no auth call. Every other read goes to the backend auth
# endpoint, which refuses it. Set the value with MTX_HLSCDNSECRET in Railway
# (same value as Bunny's edge rule). Must not contain ':'.
hlsCDNSecret: ""

###############################################
# Global settings -> WebRTC server
###############################################
# Disabled as requested
webrtc: false
webrtcAddress: :8889
webrtcEncryption: false
webrtcServerKey: server.key
webrtcServerCert: server.crt
webrtcAllowOrigins: ["*"]
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []
webrtcICEServers2: []
webrtcSTUNGatherTimeout: 5s
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s

###############################################
# Global settings -> SRT server
###############################################
# Disabled as requested
srt: false
srtAddress: :8890

###############################################
# Global settings -> MoQ server
###############################################
