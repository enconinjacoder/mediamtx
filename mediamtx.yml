###############################################
# MediaMTX Configuration File
###############################################

# General settings
logLevel: info
logDestinations: [stdout]

# Global Authentication (Disabled / Open to Everyone)
# This allows any anonymous user to publish, read, and use the API without a password.
authMethod: internal
authInternalUsers:
  - user: any
    pass: 
    ips: []
    permissions:
      - action: publish
        path: 
      - action: read
        path: 
      - action: playback
        path: 
      - action: api
        path: 
      - action: metrics
        path: 

# RTSP Server Configuration
rtspDisable: yes

# RTMP Server Configuration
rtmpDisable: no
rtmpAddress: 0.0.0.0:1935
rtmpEncryption: "no"

# HLS Server Configuration
hlsDisable: no
hlsAddress: "0.0.0.0:5081"
hlsAlwaysRemux: no
hlsSegmentDuration: 2s
hlsSegmentCount: 3600
hlsMaxDemuxerDelay: 3s

# WebRTC Server Configuration
webrtcDisable: yes

# SRT Server Configuration
srtDisable: yes

# Media-over-QUIC Server Configuration
moqDisable: yes

# Default Path Settings (Applied to all streams)
pathDefaults:
  # Ensure no restrictions are inherited at the path level
  publishUser:
  publishPass:
  publishIps: []
  readUser:
  readPass:
  readIps: []
