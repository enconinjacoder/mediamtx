###############################################
# Path settings
###############################################
paths:
  # The path is the stream's public playback_id; only streams the auth endpoint
  # allowed ever get here. MediaMTX's env needs MEDIAMTX_HOOK_SECRET and
  # BACKEND_URL (the backend's base URL, no trailing slash, e.g. http://backend.railway.internal:8080).
  ~^[0-9a-f]{32}$:
    runOnAvailable: >-
      curl --fail --silent --show-error --max-time 5
      -X POST -H "X-MediaMTX-Secret: $MEDIAMTX_HOOK_SECRET"
      "$BACKEND_URL/api/v1/streams/mediamtx/webhook?playback_id=$MTX_PATH&publisher_id=$MTX_SOURCE_ID"
    runOnAvailableRestart: false
    # Streamer's video dropped: viewers see "paused" (ignored if the stream already ended).
    runOnUnavailable: >-
      curl --fail --silent --show-error --max-time 5
      -X POST -H "X-MediaMTX-Secret: $MEDIAMTX_HOOK_SECRET"
      "$BACKEND_URL/api/v1/streams/mediamtx/webhook?playback_id=$MTX_PATH&event=unavailable"
  # 1. Matches any stream that does NOT start with 'enc_' by matching standard names 
  # and explicitly checking that the output target doesn't loop.
  # ~^([a-df-z0-9_-][a-z0-9_-]*)$:
  #   runOnAvailable: ffmpeg -i rtmp://localhost:1935/$MTX_PATH -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2500k -maxrate 2500k -bufsize 5000k -vf scale=-2:720 -g 60 -c:a aac -b:a 128k -f flv rtmp://localhost:1935/enc_$MTX_PATH
  #   runOnAvailableRestart: yes
